<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stores – VELNERY</title>
  <link rel="stylesheet" href="../CSS/styles.css">
  <link rel="stylesheet" href="../CSS/auth.css">
  <link rel="stylesheet" href="../CSS/address.css">
</head>
<body data-root="../" data-page="stores">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <h1 class="display-lg">Find a store</h1>
        <p>Search by name, town or street, or filter by province. Store details are sample data.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="toolbar">
          <input type="search" id="store-search" placeholder="Search stores" aria-label="Search stores">
          <select id="store-province" aria-label="Filter by province">
            <option value="">All provinces</option>
          </select>
        </div>
        <p class="body-sm muted" id="store-count" role="status"></p>
        <ul class="store-list" id="store-list"></ul>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="../JavaScript/main.js"></script>
<script src="../JavaScript/auth.js"></script>
<script src="../JavaScript/address.js"></script>
<script src="../JavaScript/products.js"></script>
<script src="../JavaScript/app.js"></script>
</body>
</html>
